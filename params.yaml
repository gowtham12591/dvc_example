# ==============================================================================
# MLOps Pipeline Parameters (params.yaml)
# ==============================================================================
# In MLOps, hyperparameters and split settings should NEVER be hardcoded in Python.
# By tracking params.yaml with DVC, modifying any value triggers only the affected
# pipeline stages when running `dvc repro`.
# ==============================================================================

preprocess:
  test_size: 0.2
  random_state: 42

train:
  model_type: "GradientBoosting"
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 3
  random_state: 42